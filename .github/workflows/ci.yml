name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, no API keys)
        run: pytest -q
      - name: Smoke test the CLI and queue offline
        run: |
          dbm research "AI document intake for small accounting firms" --offline -q --out /tmp/smoke
          test -s /tmp/smoke/report.html
          dbm queue add --from-file examples/requests.json --root /tmp/q
          dbm queue run --offline -q --root /tmp/q
      - name: Check landing page has no dead links
        run: |
          if grep -n 'href="#"' docs/index.html; then exit 1; fi
          test -s docs/sample/report.html
