[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "done-by-morning"
version = "0.1.0"
description = "Overnight research agent: plan sub-questions, gather sources, write a cited report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "markdown>=3.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dbm = "done_by_morning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
done_by_morning = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/done_by_morning/render.py" = ["E501"]  # inline CSS block
